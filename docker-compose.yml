services:
  db:
    image: postgres:16-alpine
    container_name: cam_db
    environment:
      # PostgreSQL usa POSTGRES_* internamente; mapeamos desde DB_* del .env
      POSTGRES_DB: ${DB_NAME:-cam_db}
      POSTGRES_USER: ${DB_USER:-cam_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Puerto externo (host): ${DB_EXTERNAL_PORT:-7000} → interno5432
      - "${DB_EXTERNAL_PORT:-7000}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cam_user} -d ${DB_NAME:-cam_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cam_backend
    env_file:
      - .env
    environment:
      # Django settings module — production por defecto, overridear en .env si es necesario
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.production}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Puerto externo (host): ${BACKEND_PORT:-7001} → interno 8000
      - "${BACKEND_PORT:-7001}:8000"
    volumes:
      - backend_static:/app/staticfiles
    restart: unless-stopped
    entrypoint: ["/app/docker/entrypoint.sh"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: cam_frontend
    env_file:
      - frontend/.env.local
    environment:
      PORT: ${FRONTEND_PORT:-70020}
      HOSTNAME: ${FRONTEND_HOSTNAME:-0.0.0.0}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000/api}
    ports:
      # Puerto externo (host): ${FRONTEND_PORT:-70020} → interno 70020
      - "${FRONTEND_PORT:-70020}:${FRONTEND_PORT:-70020}"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  backend_static:
