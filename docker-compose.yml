services:
  db:
    image: postgres:16-alpine
    container_name: cam_db
    environment:
      # PostgreSQL usa POSTGRES_* internamente; mapeamos desde DB_* del .env
      POSTGRES_DB: ${DB_NAME:-cam_db}
      POSTGRES_USER: ${DB_USER:-cam_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cam_user} -d ${DB_NAME:-cam_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  scraper:
    build:
      context: worker/scraper
      dockerfile: Dockerfile
    container_name: cam_scraper
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cam_backend
    env_file:
      - .env
    environment:
      # Django settings module — production por defecto, overridear en .env si es necesario
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.production}
      # Dentro de la red Docker, los servicios se comunican por service name.
      DB_HOST: db
      DB_PORT: 5432
      SCRAPER_URL: ${SCRAPER_URL}
    depends_on:
      db:
        condition: service_healthy
      scraper:
        condition: service_healthy
    volumes:
      - backend_static:/app/staticfiles
    restart: unless-stopped
    entrypoint: ["/app/docker/entrypoint.sh"]

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        # El navegador entra por el proxy; /backend se reescribe a /api en Django.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/backend}
        NEXT_PUBLIC_COOKIE_SECURE: ${NEXT_PUBLIC_COOKIE_SECURE:-false}
        NEXT_PUBLIC_IS_TEST_UUID: ${NEXT_PUBLIC_IS_TEST_UUID:-false}
        NEXT_PUBLIC_DEBUG_GENERIC_FORM_ERRORS: ${NEXT_PUBLIC_DEBUG_GENERIC_FORM_ERRORS:-false}
        NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL:-http://localhost:${PROXY_PORT:-7000}}
        NEXT_PUBLIC_AUTH_STORAGE_PREFIX: ${NEXT_PUBLIC_AUTH_STORAGE_PREFIX:-cam_auth}
    container_name: cam_frontend
    env_file:
      - .env
    environment:
      PORT: "3000"
      HOSTNAME: ${FRONTEND_HOSTNAME:-0.0.0.0}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/backend}
      NEXT_PUBLIC_COOKIE_SECURE: ${NEXT_PUBLIC_COOKIE_SECURE:-false}
      NEXT_PUBLIC_IS_TEST_UUID: ${NEXT_PUBLIC_IS_TEST_UUID:-false}
      NEXT_PUBLIC_DEBUG_GENERIC_FORM_ERRORS: ${NEXT_PUBLIC_DEBUG_GENERIC_FORM_ERRORS:-false}
      NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL:-http://localhost:${PROXY_PORT:-7000}}
      NEXT_PUBLIC_AUTH_STORAGE_PREFIX: ${NEXT_PUBLIC_AUTH_STORAGE_PREFIX:-cam_auth}
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    container_name: cam_proxy
    depends_on:
      - frontend
      - backend
    ports:
      # Unico puerto publico: el proxy enruta frontend y backend.
      - "${PROXY_PORT:-7000}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  postgres_data:
  backend_static:
