services:
  db:
    image: postgres:16-alpine
    container_name: cam_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cam_db}
      POSTGRES_USER: ${POSTGRES_USER:-cam_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "7000:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cam_user} -d ${POSTGRES_DB:-cam_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cam_backend
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "7001:8000"
    volumes:
      - backend_static:/app/staticfiles
    restart: unless-stopped
    entrypoint: ["/app/docker/entrypoint.sh"]

volumes:
  postgres_data:
  backend_static: