services:
  db:
    image: postgres:16-alpine
    container_name: cam_db
    environment:
      POSTGRES_DB: ${DB_NAME:-cam_db}
      POSTGRES_USER: ${DB_USER:-cam_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_EXPOSE_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cam_user} -d ${DB_NAME:-cam_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  db_backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: cam_db_backup
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${DB_NAME:-cam_db}
      POSTGRES_USER: ${DB_USER:-cam_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      SCHEDULE: ${DB_BACKUP_SCHEDULE:-0 3 * * *}
      BACKUP_KEEP_DAYS: ${DB_BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_WEEKS: ${DB_BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${DB_BACKUP_KEEP_MONTHS:-6}
      HEALTHCHECK_PORT: 8080
    volumes:
      - ./backups/postgres:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
